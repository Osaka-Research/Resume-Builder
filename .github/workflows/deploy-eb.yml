name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/deploy-eb.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION: resume-builder-jobs
  EB_ENVIRONMENT: resume-builder-jobs-env
  EB_BUCKET: elasticbeanstalk-ap-south-1-265544357989

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::265544357989:role/github-actions-eb-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Zip server bundle
        run: |
          cd server
          zip -r ../eb-deploy.zip . \
            -x "__pycache__/*" -x "*/__pycache__/*" -x "*.pyc" \
            -x "app/*" -x ".venv/*" -x ".venv-debian/*" -x "data/*" -x "*.db"

      - name: Upload bundle to S3
        run: |
          VERSION="gh-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          aws s3 cp eb-deploy.zip "s3://${EB_BUCKET}/${EB_APPLICATION}/eb-deploy-${VERSION}.zip"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --source-bundle "S3Bucket=${EB_BUCKET},S3Key=${EB_APPLICATION}/eb-deploy-${VERSION}.zip"

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION"

      - name: Wait for environment to finish updating
        run: |
          for i in $(seq 1 60); do
            read -r STATUS HEALTH DEPLOYED_VERSION <<< "$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" \
              --query "Environments[0].[Status,Health,VersionLabel]" --output text)"
            echo "status: $STATUS  health: $HEALTH  version: $DEPLOYED_VERSION (want $VERSION)"
            if [ "$STATUS" = "Ready" ] && [ "$DEPLOYED_VERSION" = "$VERSION" ]; then
              [ "$HEALTH" = "Green" ] && exit 0
              [ "$HEALTH" = "Red" ] && { echo "environment unhealthy after deploy"; exit 1; }
            fi
            sleep 10
          done
          echo "timed out waiting for environment"; exit 1
