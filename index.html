<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2454a6;
    --bg: #f4f5f7;
    --panel: #ffffff;
  }

  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* ── Toolbar ── */

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .toolbar h1 {
    font-size: 18px;
    font-weight: 700;
  }

  .toolbar .actions button {
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    margin-left: 8px;
  }

  .toolbar .actions button.secondary {
    background: #fff;
    color: var(--accent);
  }

  /* ── Layout ── */

  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 420px) 1fr;
    gap: 24px;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ── Form panel ── */

  .form-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }

  .section {
    margin-bottom: 24px;
  }

  .section:last-child { margin-bottom: 0; }

  .section h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
  }

  .field {
    margin-bottom: 10px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .field input, .field textarea {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--ink);
    resize: vertical;
  }

  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .entry {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
    position: relative;
  }

  .entry .remove-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 12px;
    font-weight: 700;
    color: #b33;
    background: none;
    border: none;
    cursor: pointer;
  }

  .add-btn {
    width: 100%;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: #eef2fa;
    border: 1px dashed var(--accent);
    border-radius: 6px;
    cursor: pointer;
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* ── Preview panel (the actual resume) ── */

  .preview-wrap {
    display: flex;
    justify-content: center;
  }

  .page {
    background: #fff;
    width: 100%;
    max-width: 800px;
    min-height: 1050px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    padding: 52px 56px;
  }

  .r-name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .r-headline {
    font-size: 15px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 2px;
  }

  .r-contact {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }

  .r-section {
    margin-top: 20px;
  }

  .r-section h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 4px;
    margin-bottom: 10px;
  }

  .r-summary {
    font-size: 13.5px;
    line-height: 1.55;
    color: #333;
  }

  .r-item {
    margin-bottom: 12px;
  }

  .r-item:last-child { margin-bottom: 0; }

  .r-item-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .r-item-title {
    font-size: 14px;
    font-weight: 700;
  }

  .r-item-sub {
    font-size: 13px;
    font-style: italic;
    color: #444;
  }

  .r-item-date {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 600;
  }

  .r-bullets {
    margin-top: 5px;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.5;
    color: #333;
  }

  .r-bullets li { margin-bottom: 2px; }

  .r-skills {
    font-size: 13px;
    line-height: 1.7;
    color: #333;
  }

  .r-skills .tag {
    display: inline-block;
    background: #eef2fa;
    color: var(--accent);
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin: 0 6px 6px 0;
    font-size: 12px;
  }

  .r-empty {
    color: #aaa;
    font-style: italic;
  }

  /* ── Print ── */

  @media print {
    .toolbar, .form-panel { display: none !important; }
    .layout { display: block; padding: 0; }
    .preview-wrap { display: block; }
    .page {
      box-shadow: none;
      max-width: none;
      width: 100%;
      min-height: 0;
      padding: 0;
    }
    body { background: #fff; }
    @page { margin: 18mm 16mm; }
  }

  /* ── Tabs ── */

  .tabs {
    display: flex;
    gap: 4px;
  }

  .tab-btn {
    font-size: 14px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }

  .tab-btn.active {
    background: var(--bg);
    color: var(--ink);
  }

  @media print {
    .tabs { display: none !important; }
  }

  /* ── Jobs tab ── */

  .jobs-layout {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  .jobs-search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .jobs-search input {
    flex: 1;
    min-width: 160px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .jobs-search select {
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }

  .jobs-search button {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }

  .jobs-status-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }

  .jobs-status {
    font-size: 13px;
    color: var(--muted);
    flex: 1;
  }

  #download-csv-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }

  .job-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }

  .job-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .job-title {
    font-size: 15px;
    font-weight: 700;
  }

  .job-company {
    font-size: 13.5px;
    color: #333;
    margin-top: 2px;
  }

  .job-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }

  .job-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .job-actions button, .job-actions a {
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }

  .job-desc {
    font-size: 13px;
    color: #444;
    margin-top: 10px;
    line-height: 1.5;
    max-height: 4.5em;
    overflow: hidden;
  }

  .jobs-loader {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 4px;
    font-size: 13px;
    color: var(--muted);
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Resume Builder</h1>
  <div class="tabs">
    <button class="tab-btn active" id="tab-build">Build Resume</button>
    <button class="tab-btn" id="tab-jobs">Find Jobs</button>
  </div>
  <div class="actions" id="build-actions">
    <button class="secondary" id="clear-btn">Clear all</button>
    <button id="print-btn">Print / Save as PDF</button>
  </div>
</div>

<!-- ── JOBS VIEW ── -->
<div class="jobs-layout" id="jobs-view" style="display:none">
  <div class="jobs-search">
    <input id="job-search-term" type="text" placeholder="Job title or keywords (e.g. Frontend Engineer)">
    <input id="job-location" type="text" placeholder="City (e.g. Remote, Bengaluru, San Francisco)">
    <select id="job-country">
      <option value="usa">USA</option>
      <option value="india">India</option>
      <option value="uk">UK</option>
      <option value="canada">Canada</option>
      <option value="australia">Australia</option>
      <option value="germany">Germany</option>
      <option value="singapore">Singapore</option>
      <option value="uae">UAE</option>
    </select>
    <button id="job-search-btn">Search</button>
  </div>
  <div class="jobs-status-row">
    <div class="jobs-status" id="jobs-status">Search Indeed for open roles — results load here.</div>
    <button id="download-csv-btn" style="display:none">Download CSV</button>
  </div>
  <div id="jobs-results"></div>
  <div class="jobs-loader" id="jobs-loader" style="display:none">
    <div class="spinner"></div>
    <span>Still searching — some job boards take longer than others…</span>
  </div>
</div>

<div class="layout" id="build-view">

  <!-- ── FORM ── -->
  <div class="form-panel">

    <div class="section">
      <h2>Personal Info</h2>
      <div class="field"><label>Full Name</label><input id="f-name" type="text" placeholder="Jordan Rivera"></div>
      <div class="field"><label>Headline / Target Role</label><input id="f-headline" type="text" placeholder="Frontend Engineer"></div>
      <div class="row2">
        <div class="field"><label>Email</label><input id="f-email" type="text" placeholder="jordan@email.com"></div>
        <div class="field"><label>Phone</label><input id="f-phone" type="text" placeholder="+91 98765 43210"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Location</label><input id="f-location" type="text" placeholder="Bengaluru, India"></div>
        <div class="field"><label>LinkedIn / Website</label><input id="f-link" type="text" placeholder="linkedin.com/in/jordan"></div>
      </div>
    </div>

    <div class="section">
      <h2>Summary</h2>
      <div class="field">
        <textarea id="f-summary" rows="4" placeholder="2-3 sentence summary of your experience and what you're looking for."></textarea>
      </div>
    </div>

    <div class="section">
      <h2>Experience</h2>
      <div id="experience-list"></div>
      <button class="add-btn" id="add-experience">+ Add Experience</button>
    </div>

    <div class="section">
      <h2>Education</h2>
      <div id="education-list"></div>
      <button class="add-btn" id="add-education">+ Add Education</button>
    </div>

    <div class="section">
      <h2>Skills</h2>
      <div class="field">
        <input id="f-skills" type="text" placeholder="JavaScript, React, Node.js, SQL">
        <div class="hint">Comma-separated</div>
      </div>
    </div>

  </div>

  <!-- ── PREVIEW ── -->
  <div class="preview-wrap">
    <div class="page" id="preview"></div>
  </div>

</div>

<template id="experience-template">
  <div class="entry" data-kind="experience">
    <button class="remove-btn">Remove</button>
    <div class="field"><label>Job Title</label><input class="e-title" type="text" placeholder="Software Engineer"></div>
    <div class="row2">
      <div class="field"><label>Company</label><input class="e-company" type="text" placeholder="Acme Corp"></div>
      <div class="field"><label>Location</label><input class="e-location" type="text" placeholder="Remote"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Start Date</label><input class="e-start" type="text" placeholder="Jan 2022"></div>
      <div class="field"><label>End Date</label><input class="e-end" type="text" placeholder="Present"></div>
    </div>
    <div class="field">
      <label>Highlights (one per line)</label>
      <textarea class="e-bullets" rows="3" placeholder="Led migration to TypeScript, cutting runtime errors by 40%"></textarea>
    </div>
  </div>
</template>

<template id="education-template">
  <div class="entry" data-kind="education">
    <button class="remove-btn">Remove</button>
    <div class="field"><label>Degree</label><input class="d-degree" type="text" placeholder="B.Tech, Computer Science"></div>
    <div class="row2">
      <div class="field"><label>School</label><input class="d-school" type="text" placeholder="IIT Bombay"></div>
      <div class="field"><label>Location</label><input class="d-location" type="text" placeholder="Mumbai, India"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Start Date</label><input class="d-start" type="text" placeholder="2018"></div>
      <div class="field"><label>End Date</label><input class="d-end" type="text" placeholder="2022"></div>
    </div>
  </div>
</template>

<script>
  const $ = sel => document.querySelector(sel);
  const preview = $("#preview");

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ── Repeatable entry lists ──

  function addEntry(listId, templateId, data) {
    const tmpl = document.getElementById(templateId);
    const node = tmpl.content.cloneNode(true);
    const entry = node.querySelector(".entry");
    entry.querySelector(".remove-btn").addEventListener("click", () => {
      entry.remove();
      render();
    });
    entry.querySelectorAll("input, textarea").forEach(el =>
      el.addEventListener("input", render));
    if (data) {
      Object.keys(data).forEach(cls => {
        const el = entry.querySelector("." + cls);
        if (el) el.value = data[cls];
      });
    }
    document.getElementById(listId).appendChild(node);
    render();
  }

  $("#add-experience").addEventListener("click", () => addEntry("experience-list", "experience-template"));
  $("#add-education").addEventListener("click", () => addEntry("education-list", "education-template"));

  // Personal info + summary + skills fields
  ["f-name", "f-headline", "f-email", "f-phone", "f-location", "f-link", "f-summary", "f-skills"]
    .forEach(id => document.getElementById(id).addEventListener("input", render));

  $("#print-btn").addEventListener("click", () => window.print());

  $("#clear-btn").addEventListener("click", () => {
    if (!confirm("Clear all fields? This can't be undone.")) return;
    document.querySelectorAll(".form-panel input, .form-panel textarea").forEach(el => el.value = "");
    document.getElementById("experience-list").innerHTML = "";
    document.getElementById("education-list").innerHTML = "";
    render();
  });

  // ── Render preview from current form state ──

  function render() {
    const name = $("#f-name").value.trim();
    const headline = $("#f-headline").value.trim();
    const email = $("#f-email").value.trim();
    const phone = $("#f-phone").value.trim();
    const location = $("#f-location").value.trim();
    const link = $("#f-link").value.trim();
    const summary = $("#f-summary").value.trim();
    const skills = $("#f-skills").value.split(",").map(s => s.trim()).filter(Boolean);

    const contactParts = [email, phone, location, link].filter(Boolean);

    const experience = [...document.querySelectorAll('#experience-list .entry')].map(e => ({
      title: e.querySelector(".e-title").value.trim(),
      company: e.querySelector(".e-company").value.trim(),
      location: e.querySelector(".e-location").value.trim(),
      start: e.querySelector(".e-start").value.trim(),
      end: e.querySelector(".e-end").value.trim(),
      bullets: e.querySelector(".e-bullets").value.split("\n").map(s => s.trim()).filter(Boolean),
    }));

    const education = [...document.querySelectorAll('#education-list .entry')].map(e => ({
      degree: e.querySelector(".d-degree").value.trim(),
      school: e.querySelector(".d-school").value.trim(),
      location: e.querySelector(".d-location").value.trim(),
      start: e.querySelector(".d-start").value.trim(),
      end: e.querySelector(".d-end").value.trim(),
    }));

    let html = "";

    html += `<div class="r-name">${escapeHtml(name) || '<span class="r-empty">Your Name</span>'}</div>`;
    if (headline) html += `<div class="r-headline">${escapeHtml(headline)}</div>`;
    if (contactParts.length) html += `<div class="r-contact">${contactParts.map(escapeHtml).join(" &nbsp;·&nbsp; ")}</div>`;

    if (summary) {
      html += `<div class="r-section"><h3>Summary</h3><div class="r-summary">${escapeHtml(summary)}</div></div>`;
    }

    if (experience.length) {
      html += `<div class="r-section"><h3>Experience</h3>`;
      experience.forEach(e => {
        if (!e.title && !e.company) return;
        html += `<div class="r-item">
          <div class="r-item-top">
            <div>
              <div class="r-item-title">${escapeHtml(e.title)}</div>
              <div class="r-item-sub">${escapeHtml(e.company)}${e.location ? " — " + escapeHtml(e.location) : ""}</div>
            </div>
            <div class="r-item-date">${escapeHtml([e.start, e.end].filter(Boolean).join(" – "))}</div>
          </div>
          ${e.bullets.length ? `<ul class="r-bullets">${e.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>` : ""}
        </div>`;
      });
      html += `</div>`;
    }

    if (education.length) {
      html += `<div class="r-section"><h3>Education</h3>`;
      education.forEach(e => {
        if (!e.degree && !e.school) return;
        html += `<div class="r-item">
          <div class="r-item-top">
            <div>
              <div class="r-item-title">${escapeHtml(e.degree)}</div>
              <div class="r-item-sub">${escapeHtml(e.school)}${e.location ? " — " + escapeHtml(e.location) : ""}</div>
            </div>
            <div class="r-item-date">${escapeHtml([e.start, e.end].filter(Boolean).join(" – "))}</div>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    if (skills.length) {
      html += `<div class="r-section"><h3>Skills</h3><div class="r-skills">${skills.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join("")}</div></div>`;
    }

    preview.innerHTML = html;
  }

  // ── Tabs ──

  const JOBS_API = "http://localhost:8422";
  let currentSearchJobs = [];
  let currentSearchLabel = "jobs";

  $("#tab-build").addEventListener("click", () => {
    $("#tab-build").classList.add("active");
    $("#tab-jobs").classList.remove("active");
    $("#build-view").style.display = "";
    $("#build-actions").style.display = "";
    $("#jobs-view").style.display = "none";
  });

  $("#tab-jobs").addEventListener("click", () => {
    $("#tab-jobs").classList.add("active");
    $("#tab-build").classList.remove("active");
    $("#jobs-view").style.display = "";
    $("#build-view").style.display = "none";
    $("#build-actions").style.display = "none";
  });

  // ── Jobs search ──

  function escapeAttr(s) {
    return (s || "").replace(/"/g, "&quot;");
  }

  const SITE_LABELS = { indeed: "Indeed", linkedin: "LinkedIn", glassdoor: "Glassdoor", zip_recruiter: "ZipRecruiter", google: "Google" };

  function jobCardHtml(j) {
    return `
      <div class="job-card">
        <div class="job-card-top">
          <div>
            <div class="job-title">${escapeHtml(j.title)}</div>
            <div class="job-company">${escapeHtml(j.company)}${j.location ? " — " + escapeHtml(j.location) : ""}</div>
            <div class="job-meta">${[SITE_LABELS[j.site] || j.site, j.job_type, j.is_remote ? "Remote" : null, j.date_posted].filter(Boolean).map(escapeHtml).join(" · ")}</div>
          </div>
          <div class="job-actions">
            <button onclick="useJobHeadline('${escapeAttr(j.title).replace(/'/g, "\\'")}')">Use as headline</button>
            ${j.url ? `<a href="${escapeAttr(j.url)}" target="_blank" rel="noopener">Open</a>` : ""}
          </div>
        </div>
        ${j.description ? `<div class="job-desc">${escapeHtml(j.description)}</div>` : ""}
      </div>
    `;
  }

  async function runJobSearch() {
    const term = $("#job-search-term").value.trim();
    const location = $("#job-location").value.trim();
    const country = $("#job-country").value;
    if (!term) {
      $("#jobs-status").textContent = "Enter a job title or keyword to search.";
      return;
    }

    $("#jobs-status").textContent = "Searching…";
    $("#jobs-results").innerHTML = "";
    $("#jobs-loader").style.display = "flex";
    $("#download-csv-btn").style.display = "none";

    currentSearchJobs = [];
    currentSearchLabel = term + (location ? " in " + location : "");
    const requestedSites = ["indeed", "linkedin", "glassdoor", "zip_recruiter", "google"];
    const siteCounts = Object.fromEntries(requestedSites.map(s => [s, null])); // null = still running
    let total = 0;

    const updateStatus = () => {
      const breakdown = requestedSites
        .map(s => `${SITE_LABELS[s]}: ${siteCounts[s] === null ? "…" : siteCounts[s]}`)
        .join(", ");
      const stillWaiting = requestedSites.some(s => siteCounts[s] === null);
      const note = stillWaiting ? " LinkedIn is usually the slowest — can take up to a minute, keep this open." : "";
      $("#jobs-status").textContent = `${total} result${total === 1 ? "" : "s"} so far for "${term}"${location ? " in " + location : ""}. (${breakdown})${note}`;
      $("#jobs-loader").style.display = stillWaiting ? "flex" : "none";
      $("#download-csv-btn").style.display = (!stillWaiting && currentSearchJobs.length) ? "" : "none";
    };
    updateStatus();

    try {
      const res = await fetch(JOBS_API + "/api/scrape-stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          search_term: term,
          location: location,
          sites: requestedSites,
          results_wanted: 200,
          timeout_seconds: 280,
          country_indeed: country,
        }),
      });

      if (!res.ok || !res.body) {
        $("#jobs-status").textContent = "Search failed to start (HTTP " + res.status + ").";
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        let nl;
        while ((nl = buf.indexOf("\n")) !== -1) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;

          const chunk = JSON.parse(line);

          if (chunk.done) {
            updateStatus();
            continue;
          }

          siteCounts[chunk.site] = chunk.count;
          if (chunk.ok && chunk.jobs.length) {
            total += chunk.jobs.length;
            currentSearchJobs.push(...chunk.jobs);
            $("#jobs-results").insertAdjacentHTML("beforeend", chunk.jobs.map(jobCardHtml).join(""));
          }
          updateStatus();
        }
      }
    } catch (err) {
      $("#jobs-status").textContent = "Couldn't reach the jobs search backend (is it running on localhost:8422?).";
      $("#jobs-loader").style.display = "none";
    }
  }

  // ── CSV export ──

  function csvCell(v) {
    const s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function jobsToCsv(jobs) {
    const columns = [
      ["site", "Site"], ["title", "Title"], ["company", "Company"], ["location", "Location"],
      ["job_type", "Job Type"], ["is_remote", "Remote"], ["date_posted", "Date Posted"],
      ["salary_min", "Salary Min"], ["salary_max", "Salary Max"], ["salary_currency", "Currency"],
      ["interval", "Pay Interval"], ["url", "URL"], ["description", "Description"],
    ];
    const header = columns.map(([, label]) => csvCell(label)).join(",");
    const rows = jobs.map(j => columns.map(([key]) => csvCell(j[key])).join(","));
    return [header, ...rows].join("\r\n");
  }

  function downloadCsv() {
    if (!currentSearchJobs.length) return;
    const csv = jobsToCsv(currentSearchJobs);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const safeLabel = currentSearchLabel.replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").toLowerCase() || "jobs";
    const a = document.createElement("a");
    a.href = url;
    a.download = `jobs-${safeLabel}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  $("#download-csv-btn").addEventListener("click", downloadCsv);

  $("#job-search-btn").addEventListener("click", runJobSearch);
  $("#job-search-term").addEventListener("keydown", e => { if (e.key === "Enter") runJobSearch(); });
  $("#job-location").addEventListener("keydown", e => { if (e.key === "Enter") runJobSearch(); });
